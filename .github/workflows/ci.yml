name: R1 quality and delivery gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Enable locked pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt -c requirements/dev.lock
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: python -m ruff format --check . && pnpm format:check
      - name: Lint and architecture boundaries
        run: python -m ruff check . && pnpm lint
      - name: Typecheck
        run: python -m mypy && pnpm typecheck
      - name: Unit and contract tests
        run: python -m pytest -m "not integration" && pnpm test
      - name: Typed SDK gate
        run: make sdk-check
      - name: Frontend production build
        run: pnpm build
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Dependency audit
        run: python -m pip_audit --strict -r requirements/runtime.lock && pnpm audit --prod --audit-level high

  temporal-time-skipping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Verify the officially supported runner architecture
        run: test "$(uname -m)" = "x86_64"
      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt -c requirements/dev.lock
      - name: Run the Temporal official time-skipping gate
        env:
          NEXWEAVE_TEMPORAL_TEST_SERVER_CACHE: ${{ runner.temp }}/temporal-test-server
        run: make time-skipping PYTHON=python

  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install locked integration verification dependencies
        run: python -m pip install -r requirements/dev.txt -c requirements/dev.lock
      - name: Start real R1 environment
        run: python scripts/bootstrap_env.py && docker compose up --build --detach --wait
      - name: Verify migration and real vertical chain
        run: |
          python scripts/verify_m1.py
          python scripts/verify_m2.py
          python scripts/verify_m3.py
          python scripts/verify_m4.py
          docker compose exec -T api python scripts/check_migrations.py
          python scripts/verify_stage_a_r1.py
          python scripts/verify_r1_review_delivery.py prepare --source-state .nexweave-data/stage-a-r1.json --state .nexweave-data/r1-review-ci/delivery.json
          trap 'docker compose start temporal' EXIT
          docker compose stop temporal
          python scripts/verify_r1_review_delivery.py queue-start --source-state .nexweave-data/stage-a-r1.json --state .nexweave-data/r1-review-ci/delivery.json
          docker compose start temporal
          python scripts/verify_r1_review_delivery.py verify-start --source-state .nexweave-data/stage-a-r1.json --state .nexweave-data/r1-review-ci/delivery.json
          docker compose stop temporal
          python scripts/verify_r1_review_delivery.py queue-decision --source-state .nexweave-data/stage-a-r1.json --state .nexweave-data/r1-review-ci/delivery.json
          docker compose start temporal
          python scripts/verify_r1_review_delivery.py verify-decision --source-state .nexweave-data/stage-a-r1.json --state .nexweave-data/r1-review-ci/delivery.json
          trap - EXIT
          python scripts/verify_m9_pack.py
          NEXWEAVE_REVIEW_DATABASE_URL="$(python -c 'from scripts.verify_m1 import environment; from urllib.parse import urlsplit,urlunsplit; p=urlsplit(environment()["NEXWEAVE_DATABASE_URL"]); print(urlunsplit(p._replace(netloc=p.netloc.replace("@postgres:","@127.0.0.1:"))))')" \
          NEXWEAVE_TEST_REDIS_URL=redis://127.0.0.1:6379/7 \
            python -m pytest -q apps/api/tests/test_r1_review_database.py apps/api/tests/test_r1_web_auth.py -m integration
          NEXWEAVE_TEMPORAL_TEST_ENDPOINT=127.0.0.1:7233 \
            NEXWEAVE_TEMPORAL_TEST_NAMESPACE=nexweave-dev \
            python -m pytest -q workers/kernel/tests/test_m4_pack_workflow.py -m integration
      - name: Collect diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop disposable environment
        if: always()
        run: docker compose down --volumes

  application-images:
    needs: [quality, temporal-time-skipping, compose-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: worker-health
            dockerfile: workers/health/Dockerfile
          - name: worker-kernel
            dockerfile: workers/kernel/Dockerfile
          - name: worker-parser
            dockerfile: workers/parser/Dockerfile
          - name: clamav
            dockerfile: infra/clamav/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    env:
      IMAGE: ghcr.io/yingerfeng-cloud/nexweave-${{ matrix.name }}
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}-${{ github.run_id }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Generate CycloneDX SBOMs and block fixable high vulnerabilities
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/container-evidence" "${RUNNER_TEMP}/trivy-cache"
          for platform in linux/amd64 linux/arm64; do
            suffix="${platform//\//-}"
            docker run --rm \
              --volume "${HOME}/.docker:/root/.docker:ro" \
              --volume "${RUNNER_TEMP}/container-evidence:/evidence" \
              --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" image --platform "${platform}" \
              --format cyclonedx \
              --output "/evidence/${{ matrix.name }}-${suffix}.cdx.json" \
              "${IMAGE}@${DIGEST}"
            docker run --rm \
              --volume "${HOME}/.docker:/root/.docker:ro" \
              --volume "${RUNNER_TEMP}/container-evidence:/evidence" \
              --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" image --platform "${platform}" \
              --db-repository ghcr.io/aquasecurity/trivy-db:2 \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --format json \
              --output "/evidence/${{ matrix.name }}-${suffix}-vulnerabilities.json" \
              "${IMAGE}@${DIGEST}"
          done
      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/container-evidence/
          if-no-files-found: error
      - name: Record scanned candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/promotion"
          jq -n --arg image "${IMAGE}" --arg digest "${DIGEST}" --arg sha "${GITHUB_SHA}" \
            '{image:$image,digest:$digest,commit:$sha}' > "${RUNNER_TEMP}/promotion/${{ matrix.name }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-${{ matrix.name }}
          path: ${{ runner.temp }}/promotion/
          if-no-files-found: error

  rustfs-candidate-image:
    needs: [quality, temporal-time-skipping, compose-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      SOURCE: quay.io/rustfs/rustfs:1.0.0-rc.4@sha256:a9fbb5e5bfce09ccd0869ac9a7b0e39191c6868d75ec4c5d08ebbd5475db5d6b
      TARGET: ghcr.io/yingerfeng-cloud/nexweave-rustfs
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - id: mirror
        name: Copy the exact upstream index to a candidate tag
        run: |
          crane copy "${SOURCE}" "${TARGET}:candidate-${GITHUB_SHA}"
          digest="$(crane digest "${TARGET}:candidate-${GITHUB_SHA}")"
          test "${digest}" = "sha256:a9fbb5e5bfce09ccd0869ac9a7b0e39191c6868d75ec4c5d08ebbd5475db5d6b"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Verify both target architectures exist
        env:
          DIGEST: ${{ steps.mirror.outputs.digest }}
        run: |
          crane manifest "${TARGET}@${DIGEST}" > "${RUNNER_TEMP}/rustfs-manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") and index("arm64")' "${RUNNER_TEMP}/rustfs-manifest.json"
      - name: Generate dual-architecture SBOMs and block fixable high vulnerabilities
        env:
          DIGEST: ${{ steps.mirror.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/container-evidence" "${RUNNER_TEMP}/trivy-cache"
          for platform in linux/amd64 linux/arm64; do
            suffix="${platform//\//-}"
            docker run --rm \
              --volume "${HOME}/.docker:/root/.docker:ro" \
              --volume "${RUNNER_TEMP}/container-evidence:/evidence" \
              --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" image --platform "${platform}" \
              --format cyclonedx \
              --output "/evidence/rustfs-${suffix}.cdx.json" \
              "${TARGET}@${DIGEST}"
            docker run --rm \
              --volume "${HOME}/.docker:/root/.docker:ro" \
              --volume "${RUNNER_TEMP}/container-evidence:/evidence" \
              --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" image --platform "${platform}" \
              --db-repository ghcr.io/aquasecurity/trivy-db:2 \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --format json \
              --output "/evidence/rustfs-${suffix}-vulnerabilities.json" \
              "${TARGET}@${DIGEST}"
          done
      - name: Upload RustFS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-evidence-rustfs
          path: ${{ runner.temp }}/container-evidence/
          if-no-files-found: error
      - name: Record scanned RustFS candidate digest
        env:
          DIGEST: ${{ steps.mirror.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/promotion"
          jq -n --arg image "${TARGET}" --arg digest "${DIGEST}" --arg sha "${GITHUB_SHA}" \
            '{image:$image,digest:$digest,commit:$sha}' > "${RUNNER_TEMP}/promotion/rustfs.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-rustfs
          path: ${{ runner.temp }}/promotion/
          if-no-files-found: error

  promote-images:
    needs:
      [
        quality,
        temporal-time-skipping,
        compose-integration,
        application-images,
        rustfs-candidate-image,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: promotion-*
          path: promotion
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.2
      - name: Verify complete same-commit candidate set and sign all digests
        run: |
          test "$(find promotion -name '*.json' | wc -l)" -eq 7
          for name in api worker-health worker-kernel worker-parser clamav web rustfs; do
            file="promotion/${name}.json"
            jq -e --arg sha "${GITHUB_SHA}" --arg image "ghcr.io/yingerfeng-cloud/nexweave-${name}" \
              '.commit==$sha and .image==$image and (.digest|test("^sha256:[a-f0-9]{64}$"))' "${file}"
            image="$(jq -r .image "${file}")"
            digest="$(jq -r .digest "${file}")"
            cosign sign --yes "${image}@${digest}"
            cosign verify \
              --certificate-identity "https://github.com/yingerfeng-cloud/NEXWEAVE/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "${image}@${digest}"
          done
      - name: Promote the fully verified candidate set
        run: |
          for file in promotion/*.json; do
            image="$(jq -r .image "${file}")"
            digest="$(jq -r .digest "${file}")"
            crane tag "${image}@${digest}" "${GITHUB_SHA}"
            test "$(crane digest "${image}:${GITHUB_SHA}")" = "${digest}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promoted-release-${{ github.sha }}
          path: promotion/
          if-no-files-found: error
