name: nexweave

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_DB: ${NEXWEAVE_POSTGRES_DB:?run make env first}
      POSTGRES_USER: ${NEXWEAVE_POSTGRES_USER:?run make env first}
      POSTGRES_PASSWORD: ${NEXWEAVE_POSTGRES_PASSWORD:?run make env first}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [platform, parser-isolated]

  redis:
    image: redis:7.4.11-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [platform]

  rustfs:
    image: quay.io/rustfs/rustfs:1.0.0-rc.3@sha256:800cf3f352a0a27e3275ca854a51f0027975d7acc7a0d52089a35bcc9fcbf0b5
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${NEXWEAVE_OBJECT_STORE_ACCESS_KEY:?run make env first}
      RUSTFS_SECRET_KEY: ${NEXWEAVE_OBJECT_STORE_SECRET_KEY:?run make env first}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks: [platform, parser-isolated]

  clamav:
    image: nexweave-clamav:1.4.3-deb12u2
    build:
      context: .
      dockerfile: infra/clamav/Dockerfile
      args:
        CLAMAV_DEBIAN_VERSION: 1.4.3+dfsg-1~deb12u2
    read_only: true
    tmpfs:
      - /run/clamav:size=16777216,mode=0755
      - /tmp:size=268435456,mode=1777
    security_opt:
      - no-new-privileges:true
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    restart: unless-stopped
    networks: [platform, parser-isolated]

  temporal:
    image: temporalio/auto-setup:1.29.6
    environment:
      BIND_ON_IP: 0.0.0.0
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${NEXWEAVE_POSTGRES_USER:?run make env first}
      POSTGRES_PWD: ${NEXWEAVE_POSTGRES_PASSWORD:?run make env first}
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: nexweave-dev
      DEFAULT_NAMESPACE_RETENTION: 7d
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [platform, parser-isolated]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NEXWEAVE_ENV: ${NEXWEAVE_ENV:-development}
      NEXWEAVE_LOG_LEVEL: ${NEXWEAVE_LOG_LEVEL:-INFO}
      NEXWEAVE_BUILD_VERSION: ${NEXWEAVE_BUILD_VERSION:-0.4.0-m3}
      NEXWEAVE_DATABASE_URL: ${NEXWEAVE_DATABASE_URL:?run make env first}
      NEXWEAVE_OBJECT_STORE_ENDPOINT: ${NEXWEAVE_OBJECT_STORE_ENDPOINT:-http://rustfs:9000}
      NEXWEAVE_OBJECT_STORE_HEALTH_URL: ${NEXWEAVE_OBJECT_STORE_HEALTH_URL:-http://rustfs:9000/health}
      NEXWEAVE_OBJECT_STORE_BUCKET: ${NEXWEAVE_OBJECT_STORE_BUCKET:-nexweave-dev}
      NEXWEAVE_OBJECT_STORE_ACCESS_KEY: ${NEXWEAVE_OBJECT_STORE_ACCESS_KEY:?run make env first}
      NEXWEAVE_OBJECT_STORE_SECRET_KEY: ${NEXWEAVE_OBJECT_STORE_SECRET_KEY:?run make env first}
      NEXWEAVE_REDIS_URL: ${NEXWEAVE_REDIS_URL:-redis://redis:6379/0}
      NEXWEAVE_TEMPORAL_ENDPOINT: ${NEXWEAVE_TEMPORAL_ENDPOINT:-temporal:7233}
      NEXWEAVE_TEMPORAL_NAMESPACE: ${NEXWEAVE_TEMPORAL_NAMESPACE:-nexweave-dev}
      NEXWEAVE_TEMPORAL_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_TASK_QUEUE:-nexweave-m0-health}
      NEXWEAVE_TEMPORAL_WORKFLOW_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_WORKFLOW_TASK_QUEUE:-nexweave-m2-workflows}
      NEXWEAVE_TEMPORAL_ACTIVITY_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_ACTIVITY_TASK_QUEUE:-nexweave-m2-activities}
      NEXWEAVE_TEMPORAL_PARSER_ACTIVITY_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_PARSER_ACTIVITY_TASK_QUEUE:-nexweave-m3-parser-activities}
      NEXWEAVE_IDENTITY_PROVIDER: ${NEXWEAVE_IDENTITY_PROVIDER:-local}
      NEXWEAVE_OIDC_ISSUER: ${NEXWEAVE_OIDC_ISSUER:-}
      NEXWEAVE_OIDC_JWKS_URL: ${NEXWEAVE_OIDC_JWKS_URL:-}
      NEXWEAVE_OIDC_AUDIENCE: ${NEXWEAVE_OIDC_AUDIENCE:-nexweave-api}
      NEXWEAVE_OIDC_ALGORITHMS: ${NEXWEAVE_OIDC_ALGORITHMS:-RS256,ES256}
      NEXWEAVE_LOCAL_DEV_IDENTITY_ENABLED: ${NEXWEAVE_LOCAL_DEV_IDENTITY_ENABLED:-true}
      NEXWEAVE_LOCAL_DEV_SIGNING_KEY: ${NEXWEAVE_LOCAL_DEV_SIGNING_KEY:?run make env first}
      NEXWEAVE_LOCAL_DEV_SUBJECT: ${NEXWEAVE_LOCAL_DEV_SUBJECT:-local-admin}
      NEXWEAVE_LOCAL_DEV_TENANT_SLUG: ${NEXWEAVE_LOCAL_DEV_TENANT_SLUG:-local}
      NEXWEAVE_SECRET_PROVIDER: ${NEXWEAVE_SECRET_PROVIDER:-local-env-m1-only}
      NEXWEAVE_OBJECT_UPLOAD_MAX_BYTES: ${NEXWEAVE_OBJECT_UPLOAD_MAX_BYTES:-104857600}
      NEXWEAVE_OBJECT_UPLOAD_SESSION_SECONDS: ${NEXWEAVE_OBJECT_UPLOAD_SESSION_SECONDS:-900}
      NEXWEAVE_MALWARE_SCANNER_PROVIDER: clamav
      NEXWEAVE_CLAMAV_HOST: ${NEXWEAVE_CLAMAV_HOST:-clamav}
      NEXWEAVE_CLAMAV_PORT: ${NEXWEAVE_CLAMAV_PORT:-3310}
      NEXWEAVE_CLAMAV_TIMEOUT_SECONDS: ${NEXWEAVE_CLAMAV_TIMEOUT_SECONDS:-30}
      NEXWEAVE_OTEL_SERVICE_NAME: ${NEXWEAVE_OTEL_SERVICE_NAME:-nexweave-api}
      NEXWEAVE_OTEL_EXPORTER_OTLP_ENDPOINT: ${NEXWEAVE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      clamav:
        condition: service_healthy
      temporal:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [platform]

  worker-health:
    build:
      context: .
      dockerfile: workers/health/Dockerfile
    environment:
      NEXWEAVE_LOG_LEVEL: ${NEXWEAVE_LOG_LEVEL:-INFO}
      NEXWEAVE_DATABASE_URL: ${NEXWEAVE_DATABASE_URL:?run make env first}
      NEXWEAVE_OBJECT_STORE_ENDPOINT: ${NEXWEAVE_OBJECT_STORE_ENDPOINT:-http://rustfs:9000}
      NEXWEAVE_REDIS_URL: ${NEXWEAVE_REDIS_URL:-redis://redis:6379/0}
      NEXWEAVE_TEMPORAL_ENDPOINT: ${NEXWEAVE_TEMPORAL_ENDPOINT:-temporal:7233}
      NEXWEAVE_TEMPORAL_NAMESPACE: ${NEXWEAVE_TEMPORAL_NAMESPACE:-nexweave-dev}
      NEXWEAVE_TEMPORAL_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_TASK_QUEUE:-nexweave-m0-health}
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  worker-kernel:
    build:
      context: .
      dockerfile: workers/kernel/Dockerfile
    environment:
      NEXWEAVE_ENV: ${NEXWEAVE_ENV:-development}
      NEXWEAVE_LOG_LEVEL: ${NEXWEAVE_LOG_LEVEL:-INFO}
      NEXWEAVE_BUILD_VERSION: ${NEXWEAVE_BUILD_VERSION:-0.4.0-m3}
      NEXWEAVE_DATABASE_URL: ${NEXWEAVE_DATABASE_URL:?run make env first}
      NEXWEAVE_OBJECT_STORE_ENDPOINT: ${NEXWEAVE_OBJECT_STORE_ENDPOINT:-http://rustfs:9000}
      NEXWEAVE_REDIS_URL: ${NEXWEAVE_REDIS_URL:-redis://redis:6379/0}
      NEXWEAVE_TEMPORAL_ENDPOINT: ${NEXWEAVE_TEMPORAL_ENDPOINT:-temporal:7233}
      NEXWEAVE_TEMPORAL_NAMESPACE: ${NEXWEAVE_TEMPORAL_NAMESPACE:-nexweave-dev}
      NEXWEAVE_TEMPORAL_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_TASK_QUEUE:-nexweave-m0-health}
      NEXWEAVE_TEMPORAL_WORKFLOW_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_WORKFLOW_TASK_QUEUE:-nexweave-m2-workflows}
      NEXWEAVE_TEMPORAL_ACTIVITY_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_ACTIVITY_TASK_QUEUE:-nexweave-m2-activities}
      NEXWEAVE_TEMPORAL_PARSER_ACTIVITY_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_PARSER_ACTIVITY_TASK_QUEUE:-nexweave-m3-parser-activities}
      NEXWEAVE_IDENTITY_PROVIDER: local
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  worker-parser:
    build:
      context: .
      dockerfile: workers/parser/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1770
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    environment:
      NEXWEAVE_ENV: ${NEXWEAVE_ENV:-development}
      NEXWEAVE_LOG_LEVEL: ${NEXWEAVE_LOG_LEVEL:-INFO}
      NEXWEAVE_BUILD_VERSION: ${NEXWEAVE_BUILD_VERSION:-0.4.0-m3}
      NEXWEAVE_DATABASE_URL: ${NEXWEAVE_DATABASE_URL:?run make env first}
      NEXWEAVE_OBJECT_STORE_ENDPOINT: ${NEXWEAVE_OBJECT_STORE_ENDPOINT:-http://rustfs:9000}
      NEXWEAVE_OBJECT_STORE_BUCKET: ${NEXWEAVE_OBJECT_STORE_BUCKET:-nexweave-dev}
      NEXWEAVE_OBJECT_STORE_ACCESS_KEY: ${NEXWEAVE_OBJECT_STORE_ACCESS_KEY:?run make env first}
      NEXWEAVE_OBJECT_STORE_SECRET_KEY: ${NEXWEAVE_OBJECT_STORE_SECRET_KEY:?run make env first}
      NEXWEAVE_TEMPORAL_ENDPOINT: ${NEXWEAVE_TEMPORAL_ENDPOINT:-temporal:7233}
      NEXWEAVE_TEMPORAL_NAMESPACE: ${NEXWEAVE_TEMPORAL_NAMESPACE:-nexweave-dev}
      NEXWEAVE_TEMPORAL_PARSER_ACTIVITY_TASK_QUEUE: ${NEXWEAVE_TEMPORAL_PARSER_ACTIVITY_TASK_QUEUE:-nexweave-m3-parser-activities}
      NEXWEAVE_PARSER_SANDBOX_HOST: parser-sandbox
      NEXWEAVE_PARSER_SANDBOX_PORT: 7001
      NEXWEAVE_IDENTITY_PROVIDER: local
      NEXWEAVE_MALWARE_SCANNER_PROVIDER: clamav
      NEXWEAVE_CLAMAV_HOST: ${NEXWEAVE_CLAMAV_HOST:-clamav}
      NEXWEAVE_CLAMAV_PORT: ${NEXWEAVE_CLAMAV_PORT:-3310}
      NEXWEAVE_CLAMAV_TIMEOUT_SECONDS: ${NEXWEAVE_CLAMAV_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      clamav:
        condition: service_healthy
      temporal:
        condition: service_healthy
      parser-sandbox:
        condition: service_healthy
    restart: unless-stopped
    networks: [parser-isolated, parser-sandbox]

  parser-sandbox:
    build:
      context: .
      dockerfile: workers/parser/Dockerfile
    command: ["python", "-m", "nexweave_worker_parser.sandbox_server"]
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1770
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 2.0
    environment:
      NEXWEAVE_LOG_LEVEL: ${NEXWEAVE_LOG_LEVEL:-INFO}
      NEXWEAVE_PARSER_SANDBOX_BIND: 0.0.0.0
      NEXWEAVE_PARSER_SANDBOX_PORT: 7001
    expose: ["7001"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 7001), 2).close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [parser-sandbox]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    driver: bridge
  parser-isolated:
    driver: bridge
    internal: true
  parser-sandbox:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  clamav-data:
